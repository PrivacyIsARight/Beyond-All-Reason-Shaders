{'on': [push, pull_request], permissions: {contents: read}, jobs: {compile: {strategy: {matrix: {os: [ubuntu-latest, macos-latest]}}, runs-on: '${{ matrix.os }}', steps: [{uses: actions/checkout@v7}, {if: runner.os == 'Linux', run: sudo apt-get update && sudo apt-get install -y glslang-tools}, {if: runner.os == 'macOS', run: brew install glslang}, {run: set -e; for f in LuaUI/Shaders/*.vert LuaUI/Shaders/*.frag; do glslangValidator --target-env opengl --aml --amb "$f"; done}]}}}
